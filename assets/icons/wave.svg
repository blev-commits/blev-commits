<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Waving hand">
  <style>
    .ink{fill:#d7ff38}.crease{stroke:#8fae16}
    .hand{transform-box:view-box;transform-origin:17px 29px;animation:wave 2.4s ease-in-out infinite}
    @keyframes wave{0%{transform:rotate(0)}8%{transform:rotate(16deg)}16%{transform:rotate(-8deg)}24%{transform:rotate(14deg)}32%{transform:rotate(-4deg)}40%{transform:rotate(10deg)}50%,100%{transform:rotate(0)}}
    @media (prefers-color-scheme: light){.ink{fill:#0e0f10}.crease{stroke:#868787}}
    @media (prefers-reduced-motion: reduce){.hand{animation:none}}
  </style>
  <g class="hand ink">
    <rect x="3.2" y="12.5" width="3.6" height="10" rx="1.8" transform="rotate(-38 5 17.5)"/>
    <rect x="9.4" y="5" width="3.4" height="13" rx="1.7"/>
    <rect x="13.2" y="3.4" width="3.4" height="14" rx="1.7"/>
    <rect x="17" y="4.4" width="3.4" height="13" rx="1.7"/>
    <rect x="20.8" y="7" width="3.4" height="11" rx="1.7"/>
    <rect x="9" y="13" width="15.2" height="15" rx="5.5"/>
    <path d="M12 21.5q4.5 2.5 9 0" class="crease" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
