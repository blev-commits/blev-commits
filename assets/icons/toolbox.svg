<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 28 28" width="28" height="28" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Toolbox">
  <style>
    .ln{stroke:#d7ff38}
    .tool{animation:hop 6s cubic-bezier(.22,.61,.36,1) 1.2s infinite}
    .t2{animation-delay:1.32s}
    @keyframes hop{0%{transform:translateY(0)}4%{transform:translateY(-2.5px)}9%,100%{transform:translateY(0)}}
    @media (prefers-color-scheme: light){.ln{stroke:#0e0f10}}
    @media (prefers-reduced-motion: reduce){.tool{animation:none}}
  </style>
  <g class="ln">
    <path class="tool" d="M5 8V5"/>
    <path class="tool t2" d="M19 8V5.5l-.75-1.5-.75 1.5V8"/>
    <path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
    <rect x="2" y="8" width="20" height="13" rx="2"/>
    <path d="M2 13h20"/>
