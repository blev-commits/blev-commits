<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Hand pointing right">
  <style>
    .hand{animation:poke 1.2s ease-in-out infinite}
    @keyframes poke{0%,100%{transform:translateX(0)}50%{transform:translateX(3.5px)}}
    @media (prefers-reduced-motion: reduce){.hand{animation:none}}
  </style>
  <g class="hand" fill="#ffc83d">
    <rect x="12" y="10.6" width="17" height="4" rx="2"/>
    <rect x="8.5" y="7" width="9.5" height="3.6" rx="1.8" transform="rotate(12 13 9)"/>
    <rect x="13.5" y="15" width="7" height="3.4" rx="1.7"/>
    <rect x="13.5" y="18.8" width="6.6" height="3.4" rx="1.7"/>
    <rect x="13.5" y="22.6" width="6" height="3.4" rx="1.7"/>
    <rect x="3" y="10.6" width="13" height="15.4" rx="4.5"/>
  </g>
</svg>
